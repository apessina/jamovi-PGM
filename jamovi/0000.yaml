---
title: Practical Growth Modeling
name: PGM
version: 0.9.0
jms: '1.0'
authors:
  - André L. R. Pessina
  - Manoel Garcia Neto
maintainer: André L. R. Pessina <andre.pessina@unesp.br>
date: '2026-07-23'
type: R
description: >-
  This package facilitates biological growth modeling through curve fitting, 
  graphical analysis, calculation of fit quality and critical points. Repository
  and more information available on
  https://github.com/apessina/jamovi-PGM/tree/main.
analyses:
  - title: Growth Curve Modeling
    name: gcurve
    ns: PGM
    menuGroup: Growth
    menuTitle: Curve Modeling
    category: analyses
    description: |-
      The analysis of Growth Curve Modeling is used to explore the sigmoidal 
      relationship between a continuous biological dependent variable, 
      usually weight, height, or another expanding unit, and one continuous 
      time variable. 
datasets:
  - name: Plant Growth (Gregorczyk, 1998)
    path: gregorczyk1998.csv
    description: >-
      Experimental values of dry matter accumulation (grams) in buckwheat plants
      during vegetation (https://doi.org/10.1111/j.1439-037X.1998.tb00424.x)
  - name: Chicken Growth (Aggrey, 2002)
    path: aggrey2002.csv
    description: >-
      Mean of body weight measurements (grams) from an unselected 
      Athens-Canadian randombred chicken population at different ages
      (https://doi.org/10.1093/ps/81.12.1782)
  - name: Avian Growth (Svagelj et al., 2019)
    path: svageljetal2019.csv
    description: >-
      Measurements of body mass (grams), bill, head, and tarsus length in female
      Imperial Shag chicks from hatching to approximately 40 days
      (https://doi.org/10.1111/jav.01864)
  - name: Leaf Growth (Peng et al., 2023)
    path: pengetal2023.csv
    description: >-
      Measurements of leaf length and width in 61 leaves of Camptotheca 
      acuminata Decne at 21 time-points during leaf expansion
      (https://doi.org/10.1016/j.ecolmodel.2023.110531)
  - name: Fruit Weight (Gerhard & Moltchanova, 2023)
    path: gerhardetal2023.csv
    description: >-
      Measurements of grape bunch weight (grams) from a vineyard in New Zealand 
      over a single growing period of 103 days
      (https://doi.org/10.1111/anzs.12380)
usesNative: true
minApp: 1.0.8

...
