---
name:  scurve
title: "Growth Curve Modeling"
menuGroup: Growth
menuTitle: Curve Modeling
version: '0.8.0'
jas: '1.2'

options:
    - name: data
      type: Data

    - name: deps
      title: "Dependent Variables"
      type: Variables
      suggested:
        - continuous
      permitted:
        - numeric

    - name: time
      title: "Time Variable"
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric

    # - name: ids
    #   title: "IDs (in development)"
    #   type: Variable
    #   suggested:
    #     - nominal
    #   permitted:
    #     - factor

    - name: model
      title: "Model"
      type: List
      options:
        - title: "Richards"
          name:  richards
        - title: "Double Richards"
          name:  drichards
        - title: "Triple Richards"
          name:  trichards
        - title: "Generalized Logistic"
          name:  glogistic
        - title: "Generalized Weibull"
          name:  gweibull
      default: richards

    - name: wtype
      title: "Error Weighting"
      type: List
      options:
        - name: none
          title: "None"
        - name: power
          title: "Power"
        - name: exp
          title: "Exponential"
        - name: tpoly
          title: "Polynomial (time)"
      default: none
      
    - name: eq
      title: "Equation"
      type: Bool
      default: true
    - name: par
      title: "Parameters"
      type: Bool
      default: true
    - name: est
      title: "Estimation Info"
      type: Bool
      default: false

    - name: aic
      title: "AIC"
      type: Bool
      default: false
    - name: aicc
      title: "AICc"
      type: Bool
      default: false
    - name: bic
      title: "BIC"
      type: Bool
      default: false
    - name: r2
      title: "R²"
      type: Bool
      default: false
    - name: r2_adj
      title: "Adjusted R²"
      type: Bool
      default: false

    - name: rmse
      title: "RMSE"
      type: Bool
      default: false
    - name: mae
      title: "MAE"
      type: Bool
      default: false
    - name: medae
      title: "MedAE"
      type: Bool
      default: false
    - name: smape
      title: "sMAPE"
      type: Bool
      default: false
    - name: rrmse
      title: "RRMSE"
      type: Bool
      default: false

    - name: dataPoints
      title: "Samples"
      type: Bool
      default: True
    - name: keyGrowth
      title: "Key growth points"
      type: Bool
      default: True      
    - name: ciPolygon
      title: "Fitted mean 95% band"
      type: Bool
      default: False
    - name: ogf
      title: "Ontogenetic growth force"
      type: Bool
      default: false
    - name: ogf_s
      title: "OGF 3rd Derivative"
      type: Bool
      default: false
    
    - name: multiPlot
      title: "Plot Multiple Curves"
      type: Bool
      default: false
    - name: sndPlot
      title: "Growth Rate and Acceleration"
      type: Bool
      default: false
    - name: resPlot
      title: "Residual plots"
      type: Bool
      default: false
      
    - name: res
      title: "x-axis"
      type: Number
      min: 1
      max: 30
      default: 20
      
    - name: fPoints
      title: "by Ontogenetic Growth Force"
      type: NMXList
      options:
        - name: ogfMax
          title: "Maximum (F1)"
        - name: ogfI
          title: "Inflection (Fi)"  
        - name: ogfMin
          title: "Minimum (F2)"
      default: null
      
    - name: pPoints
      title: "by Acceleration"
      type: NMXList
      options:
        - name: accMax
          title: "Maximum (P1)"
        - name: accI
          title: "Inflection (Pi)"  
        - name: accMin
          title: "Minimum (P2)"
      default: null

    - name: lagEnd
      title: "Exponential Phase Onset"
      type: NMXList
      options:
        - name: ogf0
          title: "OGF (F0)"
        - name: tang
          title: "Tangent"
        - name: thres
          title: "Threshold"
      default: null
    - name: thVal
      title: ''
      type: Number
      min: 0
      max: 1
      default: 0.01

    - name: asymptote
      title: "Saturation Phase Entry"
      type: NMXList
      options:
        - name: ogf3
          title: "OGF (F3)"
        - name: pda
          title: "PDA"
      default: null
      
    - name: calcAuc
      title: "Calculate AUC"
      type: Bool
      default: false
    - name: intInterval
      title: "Custom"
      type: Bool
      default: false
    - name: intL
      title: "Integral Lower"
      type: Number
      min: 0
      default: 0
    - name: intU
      title: "Integral Upper"
      type: Number
      min: 0
      default: 0

...
